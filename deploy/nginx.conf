# ───────────────────────────────────────────────────────────────────────────
# Convine — production Nginx site (single server, same-origin)
#
# Serves the built React SPA (frontend/dist) and proxies /api + /storage to
# the Laravel app (backend/public) via PHP-FPM. Because the SPA and API share
# one origin, the session cookie "just works" (no cross-origin/proxy issues).
#
# Install:
#   cp deploy/nginx.conf /etc/nginx/sites-available/convine
#   # edit YOURDOMAIN.me below, then:
#   ln -s /etc/nginx/sites-available/convine /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Assumes the repo lives at /var/www/convine and PHP 8.3-FPM.
# ───────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN.me www.YOURDOMAIN.me;

    # Allow guests to upload up to 4 photos — raise from nginx's 1 MB default.
    client_max_body_size 16M;

    # ── React SPA ──
    root /var/www/convine/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Laravel API ──
    location ^~ /api {
        root /var/www/convine/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # ── Uploaded photos (storage:link symlink in backend/public/storage) ──
    location ^~ /storage {
        root /var/www/convine/backend/public;
        try_files $uri =404;
    }

    # ── PHP-FPM (Laravel front controller) ──
    location = /index.php {
        root /var/www/convine/backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ {
        root /var/www/convine/backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Don't serve dotfiles (.env, .git, …)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Long cache for hashed SPA assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

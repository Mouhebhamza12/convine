# ───────────────────────────────────────────────────────────────────────────
# Convine — production Nginx site (single origin, Laravel serves everything).
#
# Vite builds the React SPA straight into backend/public (see frontend/vite.config.js
# `outDir: ../backend/public`), so index.html + hashed /assets sit beside Laravel's
# front controller. Laravel's routes/web.php returns the SPA shell for non-API
# routes (client-side routing), serves /api/* and /storage/* itself, and the web
# server serves built assets directly. One origin => the session cookie just works.
#
# Install:
#   cp deploy/nginx.conf /etc/nginx/sites-available/convine
#   # edit YOURDOMAIN.me + the root path below, then:
#   ln -s /etc/nginx/sites-available/convine /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# ───────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN.me www.YOURDOMAIN.me;

    # Laravel's public dir is the single document root (SPA build lands here too).
    root /var/www/convine/backend/public;
    index index.php;

    # Allow guests to upload up to 4 photos — raise nginx's 1 MB default.
    client_max_body_size 16M;

    # SPA assets are served directly; everything else falls through to Laravel,
    # which serves /api, /storage, and the SPA shell for client-side routes.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long cache for content-hashed SPA bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Never serve dotfiles (.env, .git, …).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
